[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-agent-memory"
version = "0.2.0"
description = "Cross-session persistent memory for AI Agents. Local-first, zero LLM dependency for core operations."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "chuf", email = "64515713+chuf-China@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
keywords = ["ai-agent", "memory", "persistent-memory", "llm", "knowledge-graph", "sqlite", "vector-search"]

# Core dependencies (required)
dependencies = [
    "numpy>=1.21.0",
    "click>=8.0",
]

# Optional dependencies
[project.optional-dependencies]
# Vector search support
vector = [
    "fastembed>=0.3",
    "hnswlib>=0.7",
]
# LLM integration
llm = [
    "openai>=1.0",
]
# REST API support
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0",
]

# Full installation (all optional features)
full = [
    "fastembed>=0.3",
    "hnswlib>=0.7",
    "openai>=1.0",
    "sentence-transformers>=2.2",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0",
]
# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=6.0",
]

[project.urls]
Homepage = "https://github.com/chuf-China/nexus-memory"
Repository = "https://github.com/chuf-China/nexus-memory"
Issues = "https://github.com/chuf-China/nexus-memory/issues"

[project.scripts]
nexus-memory = "src.nexus_cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.flake8]
max-line-length = 120
exclude = [".git", "__pycache__", "build", "dist"]
