version: "3.8"

services:
  nexus:
    build: .
    container_name: nexus-memory
    ports:
      - "8080:8080"
    volumes:
      - nexus-data:/data
    environment:
      - NEXUS_DB_PATH=/data/nexus.db
      - NEXUS_LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  nexus-data:
